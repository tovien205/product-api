version: '3.8'

services:
  nammongodb:
    image: mongo:latest
    container_name: nammongodb-prod
    ports:
      - "27017:27017"
    volumes:
      - mongo-prod-data:/data/db
    networks:
      - app-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  product-api:
    image: tovien205/product-api:latest
    container_name: product-api-prod
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://nammongodb:27017/productdb
    depends_on:
      nammongodb:
        condition: service_healthy
    networks:
      - app-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  app-prod-network:
    driver: bridge

volumes:
  mongo-prod-data: